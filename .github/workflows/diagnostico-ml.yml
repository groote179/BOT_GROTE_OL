name: Diagnóstico Mercado Livre

# Workflow temporário: descobre se o muro de login do Mercado Livre também
# vale para o IP do GitHub. Pode ser apagado depois que a dúvida for resolvida.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ferramentas/diagnostico-ml.mjs'
      - '.github/workflows/diagnostico-ml.yml'

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Monitor virtual: deixa o Chrome rodar "com janela" num servidor sem tela.
      # O Google Chrome ja vem instalado nos runners ubuntu-latest.
      - run: sudo apt-get install -y xvfb

      - name: Rodar o diagnóstico (Chrome numa tela virtual)
        run: xvfb-run -a --server-args="-screen 0 1536x864x24" node ferramentas/diagnostico-ml.mjs

      - name: Publicar o resultado no repositório
        if: always()
        run: |
          git config user.name "robo-olx"
          git config user.email "robo-olx@users.noreply.github.com"
          git add dados/diagnostico-ml-github.json
          if git diff --staged --quiet; then
            echo "Sem mudanca no diagnostico."
          else
            git commit -m "diagnóstico do Mercado Livre rodado no GitHub [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
